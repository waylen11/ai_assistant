# =====================================================
# AI 智能客服 - Nginx 配置
# 功能：
#   1. 前端 Vue3 SPA 静态服务（支持 history 路由模式）
#   2. /api/* 反向代理到 Spring Boot 8080
#   3. SSE 长连接优化（关闭缓冲，保持长连接）
#   4. 文件上传大小限制（100MB）
#   5. Gzip 压缩优化
# =====================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ==================== 基础配置 ====================
    charset utf-8;
    client_max_body_size 100M;

    # ==================== Gzip 压缩 ====================
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ==================== 安全头 ====================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==================== 静态资源缓存 ====================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ==================== API 反向代理 ====================
    # 注意：proxy_pass 末尾不能有 /，否则 /api/ 会被替换掉
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置（普通接口）
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ==================== SSE 流式响应专用配置 ====================
    # 聊天流式接口：/api/chat/stream 和 /api/assistant/stream
    location ~* ^/api/(chat|assistant)/stream {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # SSE 关键配置：禁用缓冲，立即推送每个 chunk
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;    # SSE 长连接超时设为 5 分钟
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;

        # 强制 SSE 响应头
        proxy_set_header Accept text/event-stream;
        add_header X-Accel-Buffering no;
        add_header Cache-Control no-cache;
    }

    # ==================== 文件上传（知识库）====================
    location /api/knowledge/upload {
        proxy_pass http://backend:8080/knowledge/upload;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 大文件上传超时
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_body_timeout 300s;
        proxy_request_buffering off;
    }

    # ==================== Vue3 SPA History 路由模式 ====================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==================== 健康检查端点 ====================
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
